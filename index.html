<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Kübban Rezervasyon</title>
  <meta name="theme-color" content="#0b7d3e" />

  <link rel="manifest" href="manifest.json?v=1" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="icons/favicon-16.png" sizes="16x16" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kübban" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main class="page">
    <header class="header">
      <button type="button" id="settingsBtn" class="settings-btn" aria-label="WhatsApp hedefini ayarla">⚙️</button>
      <h1>KÜBBAN REZERVASYON</h1>
      <p class="subtitle">Kübban Gaziantep Mutfağı</p>
    </header>

    <form id="reservationForm" class="form" novalidate>
      <div class="field">
        <label for="customerName">👤 Müşteri Adı</label>
        <input type="text" id="customerName" name="customerName" placeholder="Ad Soyad" autocomplete="off" />
        <span class="error" id="err-customerName"></span>
      </div>

      <div class="field">
        <label for="date">📅 Tarih</label>
        <input type="date" id="date" name="date" />
        <span class="error" id="err-date"></span>
      </div>

      <div class="field">
        <label for="time">🕒 Saat</label>
        <input type="time" id="time" name="time" />
        <span class="error" id="err-time"></span>
      </div>

      <div class="field">
        <label for="guestCount">👥 Kişi Sayısı</label>
        <input type="number" id="guestCount" name="guestCount" min="1" inputmode="numeric" placeholder="Örn: 4" />
        <span class="error" id="err-guestCount"></span>
      </div>

      <div class="field">
        <label for="phone">📞 Telefon</label>
        <input type="tel" id="phone" name="phone" inputmode="tel" placeholder="0555 123 45 67" autocomplete="off" />
        <span class="error" id="err-phone"></span>
      </div>

      <div class="field">
        <label for="location">📍 Yer</label>
        <input type="text" id="location" name="location" placeholder="Örn: Bahçe" autocomplete="off" />
        <span class="error" id="err-location"></span>
      </div>

      <button type="submit" id="sendBtn" class="send-btn">
        🟢 WHATSAPP'A GÖNDER
      </button>
    </form>
  </main>

  <div id="settingsOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2>WhatsApp Hedefi</h2>
      <p class="overlay-text">
        Rezervasyon mesajlarının otomatik gideceği WhatsApp numarasını veya
        grup davet linkini girin. Bu ayar bu cihazda hatırlanır, bir daha
        sormaz.
      </p>
      <input type="text" id="targetInput" placeholder="Örn: 05301234567 veya grup linki" autocomplete="off" />
      <span class="error" id="err-target"></span>
      <div class="overlay-actions">
        <button type="button" id="saveTargetBtn" class="save-btn">Kaydet</button>
        <button type="button" id="skipTargetBtn" class="skip-btn">Şimdilik Geç</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
